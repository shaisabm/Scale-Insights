<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - Seller Portal</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ccircle cx=%278%27 cy=%278%27 r=%278%27 fill=%27%235a3fd0%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/pages.css">
  <link rel="stylesheet" href="/account.css">
  <link rel="stylesheet" href="/optimizer.css">
  <link rel="stylesheet" href="/optimizer-dialogs.css">
  <link rel="stylesheet" href="/signals.css">
  <link rel="stylesheet" href="/perf-chart.css">
</head>
<body>
  <aside class="rail" id="rail" aria-label="Main menu">
    <div class="rail-head">
      <button class="hamburger" id="menu-toggle" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <a class="brand" href="/" aria-label="Home">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 16.5l4.5-4 3 2.5L19 8.5"/><path d="M15 8.5h4v4"/></svg></span>
        <span class="brand-name label">Seller Portal</span>
      </a>
    </div>
    <ul class="rail-list" id="rail-list"></ul>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
  <nav class="subnav" id="subnav" aria-label="Section menu"></nav>

  <div class="shell">
    <header class="topbar">
      <h1 class="page-title" id="page-title"><span id="page-title-text">Dashboard</span></h1>
      <div class="topbar-right">
        <label class="kb-search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20 20"/></svg>
          <input type="search" placeholder="Search our knowledge base" aria-label="Search our knowledge base">
        </label>
        <a class="trial" href="/Identity/Account/Billing">23 Days Trial Left</a>
        <div class="user">
          <button class="user-btn" id="user-btn" aria-haspopup="true" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><circle cx="12" cy="10" r="3.2"/><path d="M6 18.5c1.5-2.4 3.6-3.4 6-3.4s4.5 1 6 3.4"/></svg>
            <span class="user-name">Demo Seller</span>
            <span class="caret" aria-hidden="true"></span>
          </button>
          <div class="menu" id="user-menu" hidden>
            <a href="#">Support</a>
            <a href="/Identity/Account/Billing">Account</a>
            <a href="/Settings/Onboarding">Connect to Amazon</a>
            <a href="/Settings/User">Sub users</a>
            <hr>
            <a href="/" id="logout">Log out</a>
          </div>
        </div>
      </div>
    </header>

    <main id="view"></main>

    <footer class="footer">
      <span>© 2026 – Seller Portal</span>
      <a href="#">Privacy Policy</a>
    </footer>
  </div>

  <button class="fab fab-help" aria-label="Help">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13l-4-3H5z" fill="#fff" stroke="none"/><path d="M10 9.5a2 2 0 1 1 2.6 1.9c-.5.2-.6.5-.6 1M12 14.6v.2" stroke="#1d3da8"/></svg>
  </button>
  <button class="fab fab-chat" aria-label="Chat">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v10H10l-5 4z"/></svg>
  </button>

  <script src="/core.js"></script>
  <script src="/sales.js"></script>
  <script src="/products.js"></script>
  <script src="/ads.js"></script>
  <script src="/more.js"></script>
  <script src="/account.js"></script>
  <script src="/optimizer.js"></script>
  <script src="/app.js"></script>
</body>
</html>
